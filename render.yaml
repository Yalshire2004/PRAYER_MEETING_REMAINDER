services:
  - type: cron
    name: prayer-meeting-remainder
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 12 * * 1"
    buildCommand: npm ci
    startCommand: npm run reminder
    envVars:
      - key: TZ
        value: America/New_York
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
