<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRAYER MEETING REMAINDER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">Every Thursday at 5:00 AM</p>
        <h1>PRAYER MEETING REMAINDER</h1>
        <p class="lede">Jessica, Gianina, and Eric</p>
      </header>

      <section class="card upcoming" aria-live="polite">
        <p class="eyebrow">This week’s leader</p>
        <p id="upcoming-name" class="leader-name">Loading…</p>
        <p id="upcoming-date" class="upcoming-date"></p>
      </section>

      <blockquote class="verse">
        <p id="verse-text"></p>
        <cite id="verse-ref"></cite>
      </blockquote>

      <section>
        <div class="section-head">
          <h2>Schedule</h2>
          <p>Monday morning, everyone receives a reminder for the coming Thursday.</p>
        </div>
        <ol id="schedule" class="schedule"></ol>
      </section>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
